<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow - Histórico de Auditoria</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* CSS de Impressão de Alta Qualidade Corporativa */
        @media print {
            body { background: white; color: black; padding: 0; }
            .btn-cancelar, .btn-tema, #btnTema, .card, #btnLimparLogs, #pesquisaLog, .btn-print {
                display: none !important; /* Oculta ferramentas interativas no PDF */
            }
            .container { max-width: 100%; width: 100%; margin: 0; padding: 0; }
            .timeline::before { left: 15px; background: #333 !important; }
            .timeline-item { padding-left: 45px; page-break-inside: avoid; }
            .timeline-badge { left: 0; border-color: #333 !important; background: white !important; color: black !important; }
            .timeline-content.card {
                display: block !important;
                border: 1px solid #ccc !important;
                box-shadow: none !important;
                background: transparent !important;
                padding: 10px !important;
            }
            h1 { font-size: 22px; margin-bottom: 5px; text-transform: uppercase; }
        }
    </style>
</head>

<body>

    <div class="container">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <button onclick="window.location.href='index.html'" class="btn-cancelar" style="padding: 8px 16px;">
                ← Voltar ao Estoque
            </button>
            <div style="display: flex; gap: 10px;">
                <button onclick="window.print()" class="btn-print" style="background: #4f46e5; color: white; padding: 8px 16px;">
                    🖨️ Exportar PDF
                </button>
                <button id="btnTema" class="btn-tema">🌙 Modo Escuro</button>
            </div>
        </div>

        <h1>📋 Histórico de Auditoria</h1>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 25px; margin-top: -15px;">
            Registro cronológico completo de todas as operações realizadas no sistema para avaliação técnica.
        </p>

        <div class="card" style="display: flex; gap: 15px; align-items: center; justify-content: space-between; flex-wrap: wrap;">
            <input 
                type="text" 
                id="pesquisaLog" 
                placeholder="Filtrar eventos (ex: 'SSD', 'NOVO', 'REMOVIDO')..." 
                style="flex: 2; margin-bottom: 0;"
            >
            <button id="btnLimparLogs" class="btn-limpar" style="background-color: var(--danger); color: white;">
                🗑️ Limpar Histórico
            </button>
        </div>

        <div class="timeline" id="timelineContainer">
            </div>

    </div>

    <script>
        function carregarLogsPagina() {
            const container = document.getElementById('timelineContainer');
            const termo = document.getElementById('pesquisaLog').value.toLowerCase();
            let logs = JSON.parse(localStorage.getItem('stockflow_logs')) || [];

            if (termo) {
                logs = logs.filter(log => log.toLowerCase().includes(termo));
            }

            if (logs.length === 0) {
                container.innerHTML = `<div class="card" style="text-align:center; color: var(--text-muted); font-style:italic;">Nenhum registro de auditoria encontrado.</div>`;
                return;
            }

            container.innerHTML = logs.map(log => {
                const correspondencia = log.match(/^\[(.*?)\] (.*)$/);
                if (!correspondencia) return '';

                const timestamp = correspondencia[1];
                const mensagem = correspondencia[2];

                let tipoClasse = 'log-info';
                let icone = 'ℹ️';

                if (mensagem.includes('NOVO PRODUTO')) { tipoClasse = 'log-sucesso'; icone = '➕'; }
                else if (mensagem.includes('PRODUTO REMOVIDO')) { tipoClasse = 'log-erro'; icone = '🗑️'; }
                else if (mensagem.includes('PRODUTO EDITADO')) { tipoClasse = 'log-alerta'; icone = '✏️'; }

                return `
                    <div class="timeline-item ${tipoClasse}">
                        <div class="timeline-badge">${icone}</div>
                        <div class="timeline-content card">
                            <span class="timeline-time">${timestamp}</span>
                            <p class="timeline-text">${mensagem}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('btnLimparLogs').addEventListener('click', () => {
            if (confirm('Tem certeza de que deseja apagar permanentemente todo o histórico de alterações?')) {
                localStorage.removeItem('stockflow_logs');
                carregarLogsPagina();
            }
        });

        document.getElementById('pesquisaLog').addEventListener('input', carregarLogsPagina);

        const btnTema = document.getElementById('btnTema');
        if (localStorage.getItem('tema') === 'dark') {
            document.body.classList.add('dark-mode');
            btnTema.textContent = '☀️ Modo Claro';
        }
        btnTema.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            btnTema.textContent = isDark ? '☀️ Modo Claro' : '🌙 Modo Escuro';
            localStorage.setItem('tema', isDark ? 'dark' : 'light');
        });

        carregarLogsPagina();
    </script>
</body>
</html>
